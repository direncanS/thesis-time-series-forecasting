[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-bachelor-safe"
version = "0.1.0"
description = "Fair-core time-series forecasting + interpretability pipeline (bachelor thesis)."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [
 { name = "Z.Direncan Sahin", email = "direncansahin@gmail.com" }
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "tests*"]
exclude = ["docs*", "configs*", "results*", "checkpoints*", "lightning_logs*", "References*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
 "-ra",
 "--strict-markers",
]
markers = [
 "slow: tests that exercise real training / GPU paths (> ~30s)",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "scripts"]
extend-exclude = ["lightning_logs", "results", "checkpoints", "References"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = [
 "E501", # line length handled by formatter
 "E741", # ambiguous var names like `l` (common in ML code)
 "B008", # function call in default arg (torch common pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["F401"]
"src/common.py" = ["F401"]
# Legacy iteration patterns. B905 (zip-without-strict) + B007 (unused loop var) are
# cosmetic; the SHAP layer is auxiliary and the bootstrap + VSN iteration patterns
# are intentional (same-length guarantees by upstream contract).
"src/explainability/*.py" = ["B905", "B007"]
"src/evaluation/post_training_analysis.py" = ["B905", "B007"]
"src/training/tft_fair_5seed.py" = ["B905"]
