# Shared defaults for all experiments.
# Mirrors src/common.py::DEFAULT_CONFIG. This file is the documentation-level
# restatement so the fair-core v2 contract is visible without reading source.
# Experiments can reduce their own YAML to `extends: ../base.yaml` + overrides.

data_path: data/ETTh1.csv

# Sliding-window spec
input_len: 96
output_len: 24

# Training discipline
batch_size: 64
max_epochs: 200
patience: 10

# 5 stochastic seeds
seeds: [42, 123, 456, 789, 1024]

# Active v2 output locations
results_dir: results/bachelor_safe_v2
checkpoints_dir: checkpoints/bachelor_safe_v2

# 5-flag FP32 regime for stochastic neural models (MLP/LSTM/TFT).
# LR (closed-form OLS) is deterministic-baseline-exempt.
# Applied by src/common.py::configure_stochastic_runtime.
precision:
 matmul: highest
 tf32_matmul: false
 tf32_cudnn: false
 cudnn_deterministic: true
 cudnn_benchmark: false

# Per-model hyperparameters (locked defaults).
models:
 mlp:
 hidden_size: 128
 learning_rate: 0.0001
 weight_decay: 0.0
 lstm:
 hidden_size: 64
 num_layers: 1
 learning_rate: 0.0001
 weight_decay: 0.0
 tft:
 hidden_size: 16
 attention_head_size: 4
 dropout: 0.1
 hidden_continuous_size: 8
 learning_rate: 0.001
 weight_decay: 0.0
