# MLP baseline (reference / documentation config).
#
# Architecture (src/common.py::MLP):
#   input_size -> hidden_size -> ReLU -> hidden_size -> ReLU -> output_size
# Defaults per CLAUDE.md § 10.
#
# This file is NOT used standalone by the training pipeline. See
# configs/experiments/fair_core_v2.yaml for the experiment-level config.

model: mlp
architecture: shallow-feedforward
hidden_size: 128
n_hidden_layers: 2
activation: relu
optimizer: adam
learning_rate: 0.0001
weight_decay: 0.0
gradient_clip_norm: 0.1
loss: nn.MSELoss
