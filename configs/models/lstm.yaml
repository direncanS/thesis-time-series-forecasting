# LSTM baseline (reference / documentation config).
#
# Architecture (src/common.py::LSTMModel):
#   LSTM(input_size, hidden_size, num_layers, batch_first=True) -> FC(hidden_size, output_size)
# Defaults per CLAUDE.md § 10.

model: lstm
architecture: recurrent
input_size: 7           # ETTh1 features
hidden_size: 64
num_layers: 1
batch_first: true
optimizer: adam
learning_rate: 0.0001
weight_decay: 0.0
gradient_clip_norm: 0.1
loss: nn.MSELoss
