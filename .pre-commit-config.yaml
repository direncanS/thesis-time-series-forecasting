# Minimal pre-commit config for baseline-v1.
# Expanded in B3 (ruff) and B4 (regen_tables.py + artifact_manifest.py hooks).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-merge-conflict
