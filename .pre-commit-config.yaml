# Pre-commit config. Installed via `pre-commit install` after `conda activate thesis`.
# B4 (2026-04-22): regen_tables-verify hook added; B3 ruff hook added.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: ruff
        name: ruff (src, tests, scripts)
        entry: python -m ruff check src tests scripts
        language: system
        pass_filenames: false
        files: \.py$

      - id: regen-tables-verify
        name: regen_tables.py --verify (prose ↔ CSV sync, C12)
        entry: python scripts/regen_tables.py --verify
        language: system
        pass_filenames: false
        files: \.(csv|md|py)$
